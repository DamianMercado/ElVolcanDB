spring.application.name=ms-pago
server.port=8086
spring.jackson.time-zone=America/Santiago

spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/el_volcan_db}
spring.data.mongodb.database=${MONGO_DB:el_volcan_db}
spring.data.mongodb.auto-index-creation=true

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info

logging.level.root=INFO
logging.level.com.elvolcan.ms_pago=INFO

jwt.secret=${JWT_SECRET:ElVolcanSecretKeyParaAutenticacionMicroserviciosJWT2026Segura123456}
