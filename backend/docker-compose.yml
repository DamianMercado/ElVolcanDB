services:
  # ==================== PERSISTENCIA POLÍGLOTA (ORACLE CLOUD + MONGODB ATLAS) ====================
  # - Oracle Cloud Autonomous Database (mTLS Wallet): ms-usuario, ms-inventario, ms-pago
  # - MongoDB Atlas Cloud: ms-auth, ms-catalogo, ms-venta
  # Variables configuradas en backend/.env (wallet montada solo lectura en /app/wallet).

  # ==================== EUREKA SERVER ====================

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: elvolcan-eureka
    ports:
      - "8761:8761"
    environment:
      - TZ=${TZ:-America/Santiago}
      - SPRING_PROFILES_ACTIVE=docker
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - elvolcan-net
    restart: unless-stopped

  # ==================== API GATEWAY ====================

  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    container_name: elvolcan-gateway
    ports:
      - "8080:8080"
    environment:
      - TZ=${TZ:-America/Santiago}
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_URL=${EUREKA_URL:-http://eureka-server:8761/eureka/}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      eureka-server:
        condition: service_started
    networks:
      - elvolcan-net
    restart: unless-stopped

  # ==================== MICROSERVICIOS (ORACLE CLOUD SQL + MONGODB ATLAS) ====================

  ms-usuario:
    build:
      context: ./ms-usuario
      dockerfile: Dockerfile
    container_name: elvolcan-usuario
    ports:
      - "8081:8081"
    environment:
      - TZ=${TZ:-America/Santiago}
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_URL=${EUREKA_URL:-http://eureka-server:8761/eureka/}
      - ORACLE_URL=jdbc:oracle:thin:@${ORACLE_TNS_ALIAS:?Debes definir ORACLE_TNS_ALIAS en backend/.env}?TNS_ADMIN=/app/wallet
      - ORACLE_USER=${ORACLE_USUARIO_USER:-ELVOLCAN_USUARIO}
      - ORACLE_PASSWORD=${ORACLE_USUARIO_PASSWORD:?Debes definir ORACLE_USUARIO_PASSWORD en backend/.env}
      - ORACLE_WALLET_DIR=/app/wallet
      - JWT_SECRET=${JWT_SECRET:-ElVolcanSecretKeyParaAutenticacionMicroserviciosJWT2026Segura123456}
    volumes:
      - ${ORACLE_WALLET_HOST_DIR:-./wallet}:/app/wallet:ro
    depends_on:
      eureka-server:
        condition: service_started
    networks:
      - elvolcan-net
    restart: unless-stopped

  ms-auth:
    build:
      context: ./ms-auth
      dockerfile: Dockerfile
    container_name: elvolcan-auth
    ports:
      - "8082:8082"
    environment:
      - TZ=${TZ:-America/Santiago}
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_URL=${EUREKA_URL:-http://eureka-server:8761/eureka/}
      - MONGO_URI=${MONGO_URI:?Debes definir MONGO_URI de MongoDB Atlas en backend/.env}
      - MONGO_DB=${MONGO_DB:-el_volcan_db}
      - JWT_SECRET=${JWT_SECRET:-ElVolcanSecretKeyParaAutenticacionMicroserviciosJWT2026Segura123456}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
    depends_on:
      eureka-server:
        condition: service_started
      ms-usuario:
        condition: service_started
    networks:
      - elvolcan-net
    restart: unless-stopped

  ms-inventario:
    build:
      context: ./ms-inventario
      dockerfile: Dockerfile
    container_name: elvolcan-inventario
    ports:
      - "8083:8083"
    environment:
      - TZ=${TZ:-America/Santiago}
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_URL=${EUREKA_URL:-http://eureka-server:8761/eureka/}
      - ORACLE_URL=jdbc:oracle:thin:@${ORACLE_TNS_ALIAS:?Debes definir ORACLE_TNS_ALIAS en backend/.env}?TNS_ADMIN=/app/wallet
      - ORACLE_USER=${ORACLE_INVENTARIO_USER:-ELVOLCAN_INVENTARIO}
      - ORACLE_PASSWORD=${ORACLE_INVENTARIO_PASSWORD:?Debes definir ORACLE_INVENTARIO_PASSWORD en backend/.env}
      - ORACLE_WALLET_DIR=/app/wallet
      - JWT_SECRET=${JWT_SECRET:-ElVolcanSecretKeyParaAutenticacionMicroserviciosJWT2026Segura123456}
    volumes:
      - ${ORACLE_WALLET_HOST_DIR:-./wallet}:/app/wallet:ro
    depends_on:
      eureka-server:
        condition: service_started
      ms-auth:
        condition: service_started
    networks:
      - elvolcan-net
    restart: unless-stopped

  ms-catalogo:
    build:
      context: ./ms-catalogo
      dockerfile: Dockerfile
    container_name: elvolcan-catalogo
    ports:
      - "8084:8084"
    environment:
      - TZ=${TZ:-America/Santiago}
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_URL=${EUREKA_URL:-http://eureka-server:8761/eureka/}
      - MONGO_URI=${MONGO_URI:?Debes definir MONGO_URI de MongoDB Atlas en backend/.env}
      - MONGO_DB=${MONGO_DB:-el_volcan_db}
      - JWT_SECRET=${JWT_SECRET:-ElVolcanSecretKeyParaAutenticacionMicroserviciosJWT2026Segura123456}
    depends_on:
      eureka-server:
        condition: service_started
      ms-auth:
        condition: service_started
      ms-inventario:
        condition: service_started
    networks:
      - elvolcan-net
    restart: unless-stopped

  ms-venta:
    build:
      context: ./ms-venta
      dockerfile: Dockerfile
    container_name: elvolcan-venta
    ports:
      - "8085:8085"
    environment:
      - TZ=${TZ:-America/Santiago}
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_URL=${EUREKA_URL:-http://eureka-server:8761/eureka/}
      - MONGO_URI=${MONGO_URI:?Debes definir MONGO_URI de MongoDB Atlas en backend/.env}
      - MONGO_DB=${MONGO_DB:-el_volcan_db}
      - JWT_SECRET=${JWT_SECRET:-ElVolcanSecretKeyParaAutenticacionMicroserviciosJWT2026Segura123456}
    depends_on:
      eureka-server:
        condition: service_started
      ms-auth:
        condition: service_started
      ms-catalogo:
        condition: service_started
      ms-inventario:
        condition: service_started
    networks:
      - elvolcan-net
    restart: unless-stopped

  ms-pago:
    build:
      context: ./ms-pago
      dockerfile: Dockerfile
    container_name: elvolcan-pago
    ports:
      - "8086:8086"
    environment:
      - TZ=${TZ:-America/Santiago}
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_URL=${EUREKA_URL:-http://eureka-server:8761/eureka/}
      - ORACLE_URL=jdbc:oracle:thin:@${ORACLE_TNS_ALIAS:?Debes definir ORACLE_TNS_ALIAS en backend/.env}?TNS_ADMIN=/app/wallet
      - ORACLE_USER=${ORACLE_PAGO_USER:-ELVOLCAN_PAGO}
      - ORACLE_PASSWORD=${ORACLE_PAGO_PASSWORD:?Debes definir ORACLE_PAGO_PASSWORD en backend/.env}
      - ORACLE_WALLET_DIR=/app/wallet
      - JWT_SECRET=${JWT_SECRET:-ElVolcanSecretKeyParaAutenticacionMicroserviciosJWT2026Segura123456}
    volumes:
      - ${ORACLE_WALLET_HOST_DIR:-./wallet}:/app/wallet:ro
    depends_on:
      eureka-server:
        condition: service_started
      ms-auth:
        condition: service_started
      ms-venta:
        condition: service_started
    networks:
      - elvolcan-net
    restart: unless-stopped

networks:
  elvolcan-net:
    driver: bridge
