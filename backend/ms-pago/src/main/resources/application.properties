spring.application.name=ms-pago
server.port=8086
spring.jackson.time-zone=America/Santiago

# Persistencia relacional en Oracle Cloud Autonomous Database (mTLS Wallet)
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@elvolcandb_tp?TNS_ADMIN=/app/wallet}
spring.datasource.username=${ORACLE_USER:ELVOLCAN_PAGO}
spring.datasource.password=${ORACLE_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=${ORACLE_POOL_MAX:4}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Santiago

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info

logging.level.root=INFO
logging.level.com.elvolcan.ms_pago=INFO

jwt.secret=${JWT_SECRET:ElVolcanSecretKeyParaAutenticacionMicroserviciosJWT2026Segura123456}
